name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.2.1)"
        required: true
        type: string
      prerelease:
        description: "Preview release (mark as pre-release, don't update main or bump for next version)"
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Bump version, tag, and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release notes exist
        run: |
          if [ ! -f "RELEASE_NOTES.md" ]; then
            echo "::error::RELEASE_NOTES.md not found. Create it before running this workflow."
            exit 1
          fi
          echo "Release notes:"
          cat RELEASE_NOTES.md

      - name: Update manifest.json version
        run: |
          jq --arg v "${{ inputs.version }}" \
            '.version = $v' \
            custom_components/duofern/manifest.json > tmp.json \
            && mv tmp.json custom_components/duofern/manifest.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/duofern/manifest.json
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ inputs.version }}"

      # Preview releases are tagged from a local commit that is never pushed to
      # main, so they don't consume the "official" version bump.
      - name: Push version bump
        if: ${{ inputs.prerelease != true }}
        run: git push

      - name: Create git tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Build ZIP asset
        run: |
          cd custom_components/duofern
          zip -r "$GITHUB_WORKSPACE/duofern.zip" . -x "__pycache__/*" "*/__pycache__/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          body_path: RELEASE_NOTES.md
          files: duofern.zip
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.prerelease == true && 'false' || 'true' }}

      - name: Prepare RELEASE_NOTES.md for next release
        if: ${{ inputs.prerelease != true }}
        run: |
          # Increment the patch version (e.g. 2.2.4 -> 2.2.5)
          IFS='.' read -r major minor patch <<< "${{ inputs.version }}"
          next_version="${major}.${minor}.$((patch + 1))"
          printf "# Release v%s\n\n" "$next_version" > RELEASE_NOTES.md

      - name: Commit next release notes
        if: ${{ inputs.prerelease != true }}
        run: |
          git add RELEASE_NOTES.md
          git diff --cached --quiet || git commit -m "chore: prepare RELEASE_NOTES.md for next release"
          git push
